# Codecov configuration for the bet-settler repository.
#
# This repository is a single-module Java/Spring Boot service. Coverage is
# generated by the Maven JaCoCo plugin into target/jacoco-report/jacoco.xml
# and uploaded by .github/workflows/java_coverage.yml.
#
# Docs: https://docs.codecov.com/docs/codecov-yaml
# Validate: curl -X POST --data-binary @codecov.yml https://codecov.io/validate

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

flags:
  bet-settler-java:
    paths:
      - src/main/java/
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        informational: true
  individual_components:
    - component_id: bet_settler_java
      name: Bet Settler Java
      paths:
        - src/main/java/**

ignore:
  - "src/test/**"
  - "target/**"
  - "config/**"
