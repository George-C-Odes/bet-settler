spring:
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  kafka:
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:betsettler-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

betsettler:
  messaging:
    kafka:
      event-outcomes-topic: event-outcomes-test
    rocketmq:
      bet-settlements-topic: bet-settlements-test
      publisher-mode: logging

