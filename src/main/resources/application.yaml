spring:
  application:
    name: bet-settler
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${BET_SETTLER_KAFKA_CONSUMER_GROUP_ID:bet-settler}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.github.georgecodes.betsettler.infrastructure.messaging.kafka.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.github.georgecodes.betsettler.infrastructure.messaging.kafka.dto.EventOutcomeMessage
    listener:
      missing-topics-fatal: false
  datasource:
    url: jdbc:h2:mem:betsettler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

betsettler:
  messaging:
    kafka:
      event-outcomes-topic: ${BET_SETTLER_EVENT_OUTCOMES_TOPIC:event-outcomes}
      publish-ack-timeout: ${BET_SETTLER_KAFKA_PUBLISH_ACK_TIMEOUT:3s}
    rocketmq:
      bet-settlements-topic: ${BET_SETTLER_BET_SETTLEMENTS_TOPIC:bet-settlements}
      publisher-mode: ${BET_SETTLER_ROCKETMQ_PUBLISHER_MODE:logging}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
